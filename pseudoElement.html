<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pseudoElement</title>
    <style>
        .btn{
            padding: 10px 20px ;
            border: 1px solid ;
            font-size: 20px;
            border-radius: 5px; 
        }
        .btn:hover{
            background-color: brown;
            color: aliceblue;
        }
        .btn:focus{
            border: 5px solid;
        }
        li:nth-child(2n){
           background-color: blueviolet;
        }
    </style>
</head>
<body>
    <button class="btn">sign up</button>
    <li>ovijet</li>
    <li>ovijet</li>
    <li>ovijet</li>
    <li>ovijet</li>
    <li>ovijet</li>
</body>
</html>
