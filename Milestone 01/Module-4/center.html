<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>varticaly center and horijantaili center</title>
    <style>
      .container {
        background-color: aqua;
        height: 500px;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .box {
        background-color:green;
        margin: 0 auto;
        height: 200px;
        width: 400px;
        border-radius: 5px;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .box1 {
        background-color: rgb(241, 62, 7);
        height: 60px;
        width: 60px;
        border-radius: 50px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="box">
        <div class="box1"></div>
      </div>
    </div>
  </body>
</html>
