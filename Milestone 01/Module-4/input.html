    <title>input html</title>
    <style>
      input {
        display: block;
      }

        <input type="email" name="" id="" />
      </fieldset>

      <fieldset>
        <legend>click info</legend>
        <label for="o">ovi</label>
        <input type="radio" name="x" id="o" />

        <label for="a">ovi</label>
        <input type="radio" name="x" id="a" />

        <label for="b">ovi</label>
        <input type="radio" name="x" id="b" />

  </body>
