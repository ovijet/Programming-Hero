<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>audio and video explore</title>
  </head>
  <body>
    <audio src="media/audio.mp3" controls></audio>
    <video
      style="width: 500px"
      src="media/0-1 welcome to Complete Web Development Course.mp4"
      controls
      autoplay
    ></video>
    <iframe
      width="560"
      height="315"
      src="https://www.youtube.com/embed/df-fcvQT9KE?si=6MdpdEu2KgYkAs3x"
      title="YouTube video player"
      frameborder="0"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen
    ></iframe>
  </body>
</html>
