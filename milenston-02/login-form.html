<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .section{
            display: flex;
            border: 1px solid; 
            justify-content: center;
            height: 80vh;
            align-items: center;
            text-transform: uppercase;
        }
        form{
            display: flex;
            flex-direction: column;
            width: 40%;
            font-size: 20px;
            padding: 20px;
            background-color: orangered;
        }
        form input{
            margin: 10px;
            padding: 10px;
            font-size: 20px;
            border: none;
        }
        .btn{
            width: 100px;
            margin: 10px;
            padding: 10px 20px;
            font-size: 20px;
        }
    </style>
</head>
<body>
    <section class="section">
        <form action="">
            <h2>login form</h2>
            <input type="text" name="" id="" placeholder="your name">
            <input type="password" name="" id="" placeholder="password">
            <button class="btn">login 
            </button>
        </form>
    </section>
</body>
</html>
