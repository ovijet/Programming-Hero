<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>position-css</title>
    <style>
      .container {
        width: 400px;
        height: 200px;
        background-color: blueviolet;
        position: relative;
      }
      .box {
        width: 50px;
        height: 50px;
        background-color: brown;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50% ,-50%);
        border: 2px solid;
        border-right-radius: 10px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="box"></div>
    </div>
  </body>
</html>
